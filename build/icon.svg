<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0e231b" />
      <stop offset="60%" stop-color="#07130e" />
      <stop offset="100%" stop-color="#020705" />
    </radialGradient>

    <!-- Ring Glow Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Stem & Main Spine Gradient -->
    <linearGradient id="spineGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Leaf Top Gradient -->
    <linearGradient id="leafTop" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="70%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>

    <!-- Leaf Mid Gradient -->
    <linearGradient id="leafMid" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="70%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>

    <!-- Leaf Bottom Gradient -->
    <linearGradient id="leafBot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>

    <!-- Sprout / Tender Leaves Gradient -->
    <linearGradient id="sproutGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#d1fae5" />
    </linearGradient>

    <!-- Subtle Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle with Glass Border -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="4" stroke-opacity="0.65" />

  <!-- Ambient Internal Glow Behind the E -->
  <circle cx="240" cy="256" r="140" fill="#10b981" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="320" cy="200" r="90" fill="#34d399" opacity="0.08" filter="url(#softGlow)" />

  <!-- Botanical Vine Swirl Accents in Background -->
  <path d="M 120 380 C 110 320, 130 200, 210 140 C 260 102, 330 110, 370 145" fill="none" stroke="#059669" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="4 6" />
  <path d="M 390 350 C 420 300, 410 230, 360 190" fill="none" stroke="#34d399" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="3 5" />

  <!-- Nature Dew Spores / Stars -->
  <circle cx="160" cy="115" r="3.5" fill="#a7f3d0" opacity="0.7" />
  <circle cx="395" cy="135" r="4.5" fill="#6ee7b7" opacity="0.8" />
  <circle cx="410" cy="280" r="3" fill="#a7f3d0" opacity="0.6" />
  <circle cx="365" cy="400" r="4" fill="#34d399" opacity="0.75" />
  <circle cx="130" cy="290" r="2.5" fill="#6ee7b7" opacity="0.5" />

  <!-- Small Sprouting Leaf Bud on Left Spine -->
  <path d="M 172 205 C 150 195, 140 180, 142 165 C 158 165, 170 180, 172 205 Z" fill="url(#sproutGrad)" opacity="0.85" />
  <path d="M 172 320 C 145 328, 136 345, 140 360 C 156 358, 168 340, 172 320 Z" fill="url(#sproutGrad)" opacity="0.75" />

  <!-- THE ICONIC NATURE "E" -->
  <g filter="url(#glow)">

    <!-- Vertical Trunk / Stem of 'E' -->
    <!-- Elegantly tapered with organic rooted base and sprouting crown -->
    <path d="M 175 125
             C 175 115, 185 108, 198 108
             C 210 108, 220 115, 220 125
             L 220 387
             C 220 400, 208 408, 196 408
             C 184 408, 175 398, 175 387
             Z"
          fill="url(#spineGrad)" />

    <!-- Stem Core Highlight (Ethereal sap line) -->
    <path d="M 197 122 L 197 394" stroke="#e6fffa" stroke-width="2.5" stroke-linecap="round" opacity="0.5" />

    <!-- TOP ARM OF 'E' - Transforming into an Elegant Floating Leaf Canopy -->
    <!-- Base connection out of spine -->
    <path d="M 215 112
             C 260 110, 310 114, 350 128
             C 385 140, 408 162, 412 172
             C 400 178, 375 178, 345 170
             C 305 160, 270 156, 218 156
             Z"
          fill="url(#leafTop)" />
    <!-- Top Leaf Vein & Edge Curl -->
    <path d="M 220 134 C 280 132, 345 142, 410 171" fill="none" stroke="#e6fffa" stroke-width="2" stroke-linecap="round" opacity="0.65" />
    <path d="M 290 135 C 315 122, 335 120, 350 128" fill="none" stroke="#d1fae5" stroke-width="1.5" stroke-linecap="round" opacity="0.45" />
    <path d="M 335 143 C 360 138, 380 142, 392 153" fill="none" stroke="#d1fae5" stroke-width="1.5" stroke-linecap="round" opacity="0.45" />

    <!-- Sprouting secondary leaf off the top arm -->
    <path d="M 340 125 C 362 95, 395 90, 410 92 C 405 112, 382 125, 340 125 Z" fill="url(#sproutGrad)" opacity="0.9" />
    <path d="M 345 122 C 375 106, 405 94, 408 93" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.7" />

    <!-- MIDDLE ARM OF 'E' - Stylized Botanical Sprout Leaf -->
    <path d="M 215 236
             C 255 234, 298 232, 332 240
             C 362 247, 378 258, 382 265
             C 368 271, 346 273, 320 268
             C 280 262, 250 262, 216 264
             Z"
          fill="url(#leafMid)" />
    <!-- Middle Leaf Vein -->
    <path d="M 220 250 C 265 248, 320 252, 380 264" fill="none" stroke="#e6fffa" stroke-width="1.8" stroke-linecap="round" opacity="0.6" />
    <path d="M 275 250 C 295 240, 312 238, 326 242" fill="none" stroke="#d1fae5" stroke-width="1.2" opacity="0.4" />
    <path d="M 315 253 C 335 247, 350 250, 362 258" fill="none" stroke="#d1fae5" stroke-width="1.2" opacity="0.4" />

    <!-- BOTTOM ARM OF 'E' - Rooted Graceful Sweeping Flora -->
    <path d="M 216 362
             C 260 362, 310 366, 352 352
             C 388 340, 412 320, 416 312
             C 406 318, 382 326, 350 336
             C 310 350, 268 356, 216 394
             Z"
          fill="url(#leafBot)" />
    <!-- Bottom Arm Vein & Curl -->
    <path d="M 220 376 C 280 372, 345 352, 414 313" fill="none" stroke="#e6fffa" stroke-width="2" stroke-linecap="round" opacity="0.65" />
    <path d="M 285 370 C 310 380, 330 380, 345 372" fill="none" stroke="#d1fae5" stroke-width="1.5" stroke-linecap="round" opacity="0.45" />

    <!-- Sprouting delicate leaf downward from bottom arm -->
    <path d="M 335 375 C 352 405, 382 415, 398 414 C 395 394, 375 380, 335 375 Z" fill="url(#sproutGrad)" opacity="0.85" />
    <path d="M 340 378 C 368 395, 393 410, 396 412" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.7" />

  </g>

  <!-- Glowing Core Energy Ring around "E" -->
  <ellipse cx="280" cy="256" rx="170" ry="175" fill="none" stroke="url(#ringGrad)" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="12 18" />

  <!-- Water Drop / Dew Bead on the tip of the middle leaf -->
  <circle cx="382" cy="265" r="4" fill="#ffffff" opacity="0.9" filter="url(#glow)" />
  <circle cx="412" cy="172" r="3.5" fill="#ffffff" opacity="0.9" filter="url(#glow)" />
</svg>
